name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check inline JS in index.html
        run: |
          start=$(grep -n '^<script>$' index.html | head -1 | cut -d: -f1)
          end=$(awk -v s="$start" 'NR>s && /^<\/script>$/{print NR; exit}' index.html)
          if [ -z "$start" ] || [ -z "$end" ]; then
            echo "Could not locate the inline <script> block"; exit 1
          fi
          sed -n "$((start+1)),$((end-1))p" index.html > /tmp/index-inline.js
          node --check /tmp/index-inline.js
          echo "index.html inline JS OK"

      - name: Syntax-check resort-booking.js
        run: node --check resort-booking.js

      - name: Syntax-check the SEO generator
        run: node --check scripts/generate-seo-pages.mjs

      - name: Regenerate SEO pages (must not error)
        run: node scripts/generate-seo-pages.mjs

      - name: Verify generator output is committed (no drift)
        run: |
          if ! git diff --quiet -- resort caribbean sitemap.xml; then
            echo "::error::Generated pages are out of date. Run 'node scripts/generate-seo-pages.mjs' and commit the result."
            git diff --stat -- resort caribbean sitemap.xml | head -20
            exit 1
          fi
          echo "Generated pages are in sync with the data snapshot"

      - name: Validate JSON-LD across a sample of generated pages
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const files = fs.readdirSync("resort").filter(f => f.endsWith(".html"));
            // Sample every 25th page to keep CI fast but representative.
            const sample = files.filter((_, i) => i % 25 === 0);
            let checked = 0, bad = 0;
            const re = /<script type="application\/ld\+json">\n([\s\S]*?)\n<\/script>/g;
            for (const f of sample) {
              const html = fs.readFileSync(path.join("resort", f), "utf8");
              let m;
              while ((m = re.exec(html)) !== null) {
                checked++;
                try { JSON.parse(m[1]); }
                catch (e) { bad++; console.error("BAD JSON-LD in " + f + ": " + e.message); }
              }
            }
            console.log(`Checked ${checked} JSON-LD blocks across ${sample.length} pages, ${bad} invalid`);
            if (bad > 0) process.exit(1);
          '

      - name: Validate JSON data snapshots parse
        run: |
          for f in data/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('OK: $f')"
          done
