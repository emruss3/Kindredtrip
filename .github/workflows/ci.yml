name: CI

# Build-blocking quality gates. Family-eligibility, canonical, dedupe,
# and sitemap failures FAIL the build — programmatic page generation
# must not scale until these pass (see scripts/lib/family-rules.mjs).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests — family rules, content safety, indexability
        run: node --test scripts/tests/*.test.mjs

      - name: Syntax-check inline JS in index.html
        # Checks EVERY inline executable <script> block. The old step took the
        # first `<script>` line, which is the 5-line gtag snippet, so the app
        # script (by far the largest block) was never syntax-checked at all.
        # The size guard fails loudly if we ever stop finding the app again.
        run: |
          node - <<'EOF'
          const fs = require("fs");
          const { execFileSync } = require("child_process");
          const html = fs.readFileSync("index.html", "utf8");
          const blocks = [];
          for (const m of html.matchAll(/<script(\s[^>]*)?>([\s\S]*?)<\/script>/gi)) {
            const attrs = m[1] || "";
            if (/\bsrc\s*=/i.test(attrs)) continue; // external script
            const type = (attrs.match(/type\s*=\s*["']?([^"'\s>]+)/i) || [])[1];
            if (type && !/^(text\/javascript|application\/javascript|module)$/i.test(type)) continue; // e.g. JSON-LD
            blocks.push({ line: html.slice(0, m.index).split("\n").length, code: m[2] });
          }
          if (!blocks.length) { console.error("No inline <script> blocks found"); process.exit(1); }
          let failed = false;
          blocks.forEach((b, i) => {
            const file = `/tmp/index-inline-${i}.js`;
            fs.writeFileSync(file, b.code);
            try {
              execFileSync("node", ["--check", file], { stdio: "inherit" });
              console.log(`OK   inline script @ line ${b.line} (${b.code.length} chars)`);
            } catch {
              console.error(`FAIL inline script @ line ${b.line}`);
              failed = true;
            }
          });
          const largest = Math.max(...blocks.map((b) => b.code.length));
          if (largest < 10000) {
            console.error(`Largest inline script is only ${largest} chars — the app script was not found`);
            process.exit(1);
          }
          if (failed) process.exit(1);
          console.log(`index.html inline JS OK (${blocks.length} blocks checked; app script = ${largest} chars)`);
          EOF

      - name: Syntax-check resort-booking.js and party.js
        run: |
          node --check resort-booking.js
          node --check party.js

      - name: Regenerate SEO pages (must not error)
        run: node scripts/generate-seo-pages.mjs

      - name: Verify generator output is committed (no drift)
        run: |
          if ! git diff --quiet -- resort caribbean from compare sitemap.xml index.html about.html llms.txt; then
            echo "::error::Generated pages are out of date. Run 'node scripts/generate-seo-pages.mjs' and commit the result."
            git diff --stat -- resort caribbean from compare sitemap.xml index.html about.html llms.txt | head -20
            exit 1
          fi
          echo "Generated pages are in sync with the data snapshot"

      - name: Validate generated site — crawl, sitemap, canonical, eligibility gates
        run: node scripts/validate-site.mjs

      - name: Validate JSON data snapshots parse
        run: |
          for f in data/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('OK: $f')"
          done
